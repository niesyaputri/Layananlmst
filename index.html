<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B6CB0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Layanan LMSt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Layanan Pegawai LMSt ARK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5FC;--ink:#1B3350;--muted:#526A87;--line:#D3E3F4;--pri:#2B6CB0;--tint:#DCEBFA;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:'Nunito',system-ui,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;color:var(--ink);font-size:15px;line-height:1.4}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media(min-width:700px){body{background:#E3EEF9}#app{box-shadow:0 0 0 1px var(--line);}}
.screen{flex:1;display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top) + 20px) 20px 24px}
.has-nav .screen{padding-bottom:20px}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:800}
h2{margin:0;font-size:18px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--pri)}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--tint);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap}
.emoji-row span{width:42px;height:42px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.btn{height:52px;border:0;border-radius:14px;background:var(--pri);color:#fff;font-weight:800;font-size:16px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri);font-weight:700}
.btn.soft{background:var(--tint);color:#1F4E8C}
.btn.warn{background:#F7E0E4;color:#86384A}
.btn.sm{height:auto;min-height:42px;font-size:13.5px;padding:8px 10px;line-height:1.2}
.row{display:flex;gap:10px}
.row>*{flex:1}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
label.lbl{font-size:13px;font-weight:800;display:block;margin-bottom:6px}
.req{color:var(--pri)}
.inp{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:10px 14px;outline:none}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px #DCEBFA}
textarea.inp{resize:vertical;min-height:84px}
.codes{display:flex;gap:10px}
.codes input{width:56px;height:56px;text-align:center;font-size:24px;font-weight:800;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
.codes input:focus{border-color:var(--pri);box-shadow:0 0 0 3px #DCEBFA}
.codes.ok input{border-color:#8FD0AA;background:#F2FBF6}
.codes.bad input{border-color:#E3A6B2}
.list{display:flex;flex-direction:column;gap:6px}
.pick{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pick:active{background:var(--tint)}
.chosen{background:var(--tint);border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
.fchip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.topbar{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:0;border-radius:18px;padding:14px 6px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:800;font-size:13px;line-height:1.2}
.tile .em{font-size:30px;line-height:1}
.satk{border:2px solid transparent;border-radius:18px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;width:100%}
.satk.mine{border-color:var(--pri)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:700}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tk{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.tk .t{display:flex;gap:10px;align-items:flex-start}
.tk .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.kv{display:flex;flex-direction:column;gap:2px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font-size:12px;color:var(--muted);font-weight:700}
.kv .v{white-space:pre-wrap;word-break:break-word}
.note{border-radius:14px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.note.blue{background:var(--tint);color:#1F4E8C}
.note.rose{background:#F7E0E4;color:#86384A}
.note.peach{background:#FBE6D4;color:#85461A}
.note.green{background:#D8F0E2;color:#23603F}
.note.lilac{background:#E6DEF7;color:#55388A}
.option{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:15px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.option:active{background:var(--tint)}
.nav{position:sticky;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:5}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700}
.nav .pill{position:relative;width:48px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:20px}
.nav button.on{color:var(--pri)}
.nav button.on .pill{background:var(--tint)}
.badge{position:absolute;top:-6px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pri);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:420px;width:calc(100% - 40px);background:#1B3350;color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;z-index:50;box-shadow:0 6px 24px rgba(27,51,80,.3)}
.toast.err{background:#86384A}
.overlay{position:fixed;inset:0;background:rgba(27,51,80,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.spin{width:20px;height:20px;border:3px solid #fff;border-top-color:transparent;border-radius:999px;animation:sp .8s linear infinite}
.spin.dark{border-color:var(--pri);border-top-color:transparent}
@keyframes sp{to{transform:rotate(360deg)}}
.center{display:flex;justify-content:center;padding:30px 0}
.av{position:relative;width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.av .bd{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#fff;border:2px solid var(--pri);color:var(--pri);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.team{display:flex;flex-wrap:wrap;gap:10px}
.team>div{width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .n{font-size:24px;font-weight:800}
.bar{height:12px;background:#E4EEF9;border-radius:999px;overflow:hidden;flex:1}
.bar i{display:block;height:12px;background:var(--pri);border-radius:999px}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:5px;vertical-align:-1px}
.org{display:flex;flex-direction:column;align-items:center}
.org .top{background:var(--pri);color:#fff;border-radius:14px;padding:8px 18px;text-align:center}
.org .vl{width:2px;height:14px;background:#B9CDE3}
.org .hl{width:66%;height:2px;background:#B9CDE3}
.org .kids{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.org .kid{display:flex;flex-direction:column;align-items:center}
.org .kid>div:last-child{width:100%;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:#C9D8EA;position:relative;flex:none;transition:.15s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:999px;background:#fff;transition:.15s}
.switch[aria-checked=true]{background:var(--pri)}
.switch[aria-checked=true] i{left:25px}
.tl{display:flex;flex-direction:column;gap:0}
.tl>div{display:flex;gap:10px;padding:6px 0}
.tl .dot{width:10px;height:10px;border-radius:999px;background:var(--pri);margin-top:6px;flex:none}
.setup{background:#FBE6D4;color:#85461A;border-radius:14px;padding:12px 14px;font-size:13.5px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ PENGATURAN ============
   Tempel URL Web app Google Apps Script di antara tanda kutip (lihat panduan pemasangan). */
const API_URL = 'https://script.google.com/macros/s/AKfycbxfCXWDbbzCnmwQvurpdBvNLssmtFfqdiAt9me-n2rZ6CQHkBXsc_3oEmabPEgAMHH7dw/exec';

/* ============ UTIL ============ */
const STATUS = {
  'Baru': ['#D9E8FA', '#1F4E8C', '🆕'],
  'Diproses': ['#E6DEF7', '#55388A', '⚙️'],
  'Menunggu review': ['#FBE6D4', '#85461A', '🔎'],
  'Selesai': ['#D8F0E2', '#23603F', '✅'],
  'Tidak bisa diproses': ['#F7E0E4', '#86384A', '🚫'],
  'Dibatalkan': ['#E4E8EE', '#52606F', '❌']
};
const FINAL = ['Selesai', 'Tidak bisa diproses', 'Dibatalkan'];
const TILE = [['#D9E8FA', '#1F4E8C'], ['#E6DEF7', '#55388A'], ['#D8F0E2', '#23603F'], ['#FBE6D4', '#85461A'], ['#F7E0E4', '#86384A'], ['#DCEBFA', '#1B3350']];
const SATKER_STYLE = {
  'DPAI': ['🔍', '#D9E8FA', 'Departemen Audit Internal'],
  'DRPK': ['🛡️', '#E6DEF7', 'Departemen Manajemen Risiko dan Pengendalian Kualitas'],
  'DPIK': ['⚖️', '#D8F0E2', 'Departemen Penegakan Integritas dan Audit Khusus'],
  'Depkom ARK': ['🏛️', '#FBE6D4', 'Deputi Komisioner Audit Internal, Manajemen Risiko dan Pengendalian Kualitas']
};
const LEVEL_STYLE = { L3: ['#2B6CB0', '#FFFFFF'], L2: ['#E6DEF7', '#55388A'], L1: ['#D9E8FA', '#1F4E8C'] };
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else if (k === 'value') n.value = v;
    else if (v === true) n.setAttribute(k, '');
    else n.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; n.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
}
const sp = (t, s) => el('span', { style: s || '' }, t);
function fmtD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? (+m[3]) + ' ' + BULAN[+m[2] - 1] : ''; }
function fmtDT(s) { const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(s || ''); return m ? (+m[3]) + ' ' + BULAN[+m[2] - 1] + ', ' + m[4] : ''; }
function fmtDfull(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? (+m[3]) + ' ' + BULAN[+m[2] - 1] + ' ' + m[1] : s; }
function statusChip(st) { const c = STATUS[st] || STATUS['Baru']; return el('span', { class: 'chip', style: 'background:' + c[0] + ';color:' + c[1] }, c[2] + ' ' + st); }
function initials(n) { const p = n.trim().split(/\s+/); return ((p[0] || '')[0] + (p[1] ? p[1][0] : (p[0] || '')[1] || '')).toUpperCase(); }
function detailRows(t) {
  return (t || '').split('\n').filter(Boolean).map(l => { const i = l.indexOf(': '); if (i <= 0) return ['', l]; const v = l.slice(i + 2); return [l.slice(0, i), /^\d{4}-\d{2}-\d{2}$/.test(v) ? fmtDfull(v) : v]; });
}
function wd(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function dparse(s) { const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null; }

/* ============ API ============ */
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const API = (LOCAL && new URLSearchParams(location.search).get('api')) || API_URL;
async function api(body) {
  if (!API) throw new Error('Aplikasi belum tersambung ke Google Sheet. Hubungi tim LMSt.');
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
  } catch (e) { throw new Error('Tidak ada koneksi. Coba lagi.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Server belum siap. Coba lagi sebentar lagi.'); }
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan');
  return j;
}

/* ============ STATE ============ */
const S = { screen: 'login', p: {}, kode: '', nama: '', satker: '', hello: null, mine: null, tim: null, pin: '', untuk: '', busy: false };
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const app = document.getElementById('app');
let toastT;
function toast(msg, err) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = el('div', { class: 'toast' + (err ? ' err' : ''), role: 'status' }, msg);
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 4500 : 2500);
}
const isTim = () => !!(S.hello && S.hello.tim.includes(S.nama));
const me = () => S.tim && S.tim.me;

function go(screen, p, replace) {
  S.screen = screen; S.p = p || {};
  const st = { screen, p: S.p };
  if (replace) history.replaceState(st, ''); else history.pushState(st, '');
  render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => {
  const st = e.state;
  if (st && st.screen && S.nama) { S.screen = st.screen; S.p = st.p || {}; render(); }
});

/* ============ KERANGKA ============ */
function nav(active) {
  const items = [['buat', '✏️', 'Buat', () => go('satker')], ['mine', '📋', 'Permintaanku', () => openMine()]];
  if (isTim()) items.push(['tim', '👥', 'Tim', () => openTim()]);
  items.push(['saya', '🙂', 'Saya', () => go('saya')]);
  const badge = isTim() && S.tim ? S.tim.tiket.filter(t => t.status === 'Baru').length : 0;
  return el('div', { class: 'nav' }, items.map(([k, e, l, f]) =>
    el('button', { class: k === active ? 'on' : '', onclick: f, 'aria-label': l },
      el('span', { class: 'pill' }, e, k === 'tim' && badge ? el('span', { class: 'badge' }, badge) : null), sp(l))));
}
function shell(content, active) {
  app.className = active ? 'has-nav' : '';
  return [el('div', { class: 'screen' }, content), active ? nav(active) : null];
}
function topbar(label, right, onback) {
  return el('div', { class: 'topbar' },
    el('button', { class: 'back', 'aria-label': 'Kembali', onclick: onback || (() => history.back()) }, '‹'),
    el('span', { style: 'font-weight:800;flex:1' }, label), right || null);
}

function render() {
  const f = SCREENS[S.screen] || SCREENS.login;
  const out = f();
  app.replaceChildren(...out.filter(Boolean));
}

/* ============ MASUK ============ */
const LOGIN = { digits: ['', '', '', ''], ok: false, bad: '', checking: false, q: '', picked: null };
function loginScreen() {
  const kids = [];
  kids.push(el('div', { class: 'hero' },
    el('div', { class: 'emoji-row' }, ['🏢', '🍔', '✈️', '📁', '🔐'].map(e => sp(e))),
    el('div', {}, el('div', { class: 'eyebrow' }, 'LMSt ARK'), h1('Layanan Pegawai 👋')),
    el('p', { class: 'muted' }, 'Satu pintu untuk kebutuhan non-teknis kantor. Ajukan sekali, pantau sampai selesai. ✨')));
  if (!API) kids.push(el('div', { class: 'setup' }, '⚙️ Aplikasi belum tersambung ke Google Sheet. Isi API_URL di index.html (lihat panduan pemasangan).'));

  const codes = el('div', { class: 'codes' + (LOGIN.ok ? ' ok' : LOGIN.bad ? ' bad' : '') });
  const ins = [0, 1, 2, 3].map(i => el('input', {
    type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '1', autocomplete: 'off', 'aria-label': 'Digit kode ' + (i + 1),
    value: LOGIN.digits[i],
    oninput: e => {
      const v = e.target.value.replace(/\D/g, '').slice(-1); e.target.value = v; LOGIN.digits[i] = v; LOGIN.ok = false; LOGIN.bad = '';
      if (v && i < 3) ins[i + 1].focus();
      if (LOGIN.digits.every(Boolean)) checkKode(); else refreshLogin();
    },
    onkeydown: e => { if (e.key === 'Backspace' && !e.target.value && i > 0) { ins[i - 1].focus(); } },
    onpaste: e => {
      const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4); if (!t) return; e.preventDefault();
      t.split('').forEach((c, j) => { ins[j].value = c; LOGIN.digits[j] = c; }); if (t.length === 4) checkKode();
    }
  }));
  codes.append(...ins);
  kids.push(el('div', { id: 'login-code' }, el('label', { class: 'lbl' }, '🔑 Kode akses'), codes,
    el('p', { class: 'muted small', style: 'margin-top:6px', id: 'code-help' }, LOGIN.checking ? 'Memeriksa kode…' : LOGIN.bad ? '⚠️ ' + LOGIN.bad : LOGIN.ok ? '✅ Kode benar' : 'Kode 4 angka dibagikan LMSt lewat grup kantor.')));

  kids.push(el('div', { id: 'login-name', class: LOGIN.ok ? '' : 'hide' }, el('label', { class: 'lbl', for: 'q' }, '🙋 Nama kamu'), nameBox()));
  kids.push(el('button', { class: 'btn', id: 'login-btn', disabled: !(LOGIN.ok && LOGIN.picked), onclick: doLogin }, 'Masuk 🚀'));

  } catch (e) { S.busy = false; DT.err = e.message; render(); return false; }
