:root{
  --bg:#F5F9FF; --card:#fff; --line:#E3ECF8; --ink:#22324A; --muted:#52657F; --muted2:#3E5270;
  --pri:#3F6FC2; --pri-d:#2B4F94; --pri-l:#E3EDFC; --pri-m:#B9CFF0;
  --lav:#EEEAFE; --lav-d:#4B3DB0; --mint:#DDF4EA; --mint-d:#1F6E55; --peach:#FFE6D9; --peach-d:#9A4A22;
  --rose:#FCE4EA; --rose-d:#8E3049; --butter:#FFF4D6; --butter-d:#6B4E00; --gray:#EEF1F5;
  --r:20px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
body.hasnav{padding-bottom:calc(92px + var(--safe-b))}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,.fr{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
#app{max-width:560px;margin:0 auto}
.page{padding:calc(18px + var(--safe-t)) 18px 22px;display:flex;flex-direction:column;gap:14px;animation:fade .18s ease}
@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}
.h1{font-size:26px;line-height:1.15}
.h2{font-size:18px}
.top{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.small{font-size:12px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.lbl{font-size:13px;font-weight:800;color:var(--muted2)}
.sec{font-size:15px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ic{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:27px;height:27px}
.ic.sm{width:36px;height:36px;border-radius:12px}.ic.sm svg{width:22px;height:22px}
.ic.lg{width:52px;height:52px;border-radius:18px}.ic.lg svg{width:32px;height:32px}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1;font-size:25px}
.ic.sm .emo{font-size:20px}.ic.lg .emo{font-size:29px}
.nav .pillic .emo{font-size:22px}.nav button:not(.on) .pillic .emo{filter:saturate(.85)}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.btn{min-height:50px;border:none;border-radius:16px;background:var(--pri);color:#fff;font-weight:800;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;cursor:pointer;text-decoration:none;width:100%}
.btn:active,.tile:active,.chipbtn:active,.pickc:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--pri-d);border:1.5px solid var(--pri)}
.btn.soft{background:var(--pri-l);color:var(--pri-d)}
.btn.wa{background:#25A35A}
.btn.rose{background:var(--rose);color:var(--rose-d)}
.btn.line{background:#fff;color:var(--pri-d);border:1px solid var(--line)}
.btn.sm{min-height:40px;font-size:13.5px;border-radius:12px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.55;pointer-events:none}
.pill{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.in{width:100%;min-width:0;border:1.5px solid #CFDDF3;border-radius:14px;padding:12px 13px;font-size:16px;background:#FBFDFF;outline:none}
.in:focus{border-color:var(--pri);background:#fff}
textarea.in{resize:vertical;min-height:84px;line-height:1.4}
input[type=date].in,input[type=time].in{-webkit-appearance:none;appearance:none;min-height:48px;display:block}
.hint{font-size:12px;line-height:1.4;color:var(--muted)}
.err{font-size:12.5px;font-weight:700;color:var(--rose-d)}
.req{color:var(--pri)}
.chips{display:grid;gap:8px}
.chipbtn{min-height:46px;padding:7px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--muted2);font-weight:700;font-size:14px;line-height:1.25;cursor:pointer}
.chipbtn.on{border:2px solid var(--pri);background:var(--pri-l);color:var(--pri-d);font-weight:800}
.panduan{background:var(--butter);color:var(--butter-d);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45}
.panduan.blue{background:#E8F2FD;color:var(--pri-d)}
.panduan li{display:flex;gap:8px;align-items:flex-start}
.panduan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.note{border-radius:16px;padding:12px 14px;display:flex;gap:10px;font-size:13px;line-height:1.45}
.note.red{background:var(--rose);color:var(--rose-d)}
.note.green{background:var(--mint);color:var(--mint-d)}
.note.blue{background:var(--pri-l);color:var(--pri-d)}
.secthead{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--ink);text-align:center;min-height:108px;font-weight:800;font-size:12.5px;line-height:1.25}
.sat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;color:var(--ink)}
.sat b{font-size:16px}
.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.list{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv .k{color:var(--muted);flex-shrink:0;max-width:45%}
.kv .v{font-weight:700;text-align:right;word-break:break-word;white-space:pre-line}
.tl{display:flex;flex-direction:column;gap:10px}
.tl .ev{display:flex;gap:10px;font-size:13px}
.tl .dot{width:10px;height:10px;border-radius:99px;background:var(--pri-m);margin-top:5px;flex-shrink:0}
.tl .ev:first-child .dot{background:var(--pri)}
.hero{background:var(--pri);color:#fff;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-28px;top:-34px;width:120px;height:120px;border-radius:99px;background:#5F8BD3}
.hero>*{position:relative;z-index:1}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel>*{scroll-snap-align:start;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted2);font-weight:800;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:14px;border-radius:9px;background:#EEF3FA;overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.av{width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:16px;flex-shrink:0;border:3px solid #fff}
.pickc{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.pickc.on{border:2px solid var(--pri);background:#F2F7FE}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:center;padding:6px 4px calc(10px + var(--safe-b));background:#fff;border-top:1px solid var(--line);border-radius:24px 24px 0 0;max-width:560px;margin:0 auto}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;position:relative;padding:0}
.nav button svg{width:25px;height:25px}
.nav button.on{color:var(--pri-d);font-weight:800}
.nav .pillic{width:50px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center}
.nav button.on .pillic{background:var(--pri-l)}
.nav .badge{position:absolute;top:2px;right:calc(50% - 22px);background:#E0708F;color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{min-height:32px;min-width:44px;border:0;border-radius:99px;background:transparent;color:var(--muted);font-weight:800;font-size:12.5px;cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
.codebox{position:relative;display:flex;justify-content:space-between;gap:8px}
.codebox span{width:23%;max-width:62px;aspect-ratio:1;border-radius:16px;border:1.5px solid #CFDDF3;background:#FBFDFF;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.codebox span.cur{border:2px solid var(--pri);background:#fff}
.codebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;caret-color:transparent;color:transparent;background:transparent}
.sugg{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.sugg button{display:flex;justify-content:space-between;width:100%;min-height:44px;padding:0 14px;border:0;border-top:1px solid var(--line);background:#fff;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.sugg button:first-child{border-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + var(--safe-b));background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
.toast.err{background:var(--rose-d)}
.sheetbg{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + var(--safe-b));width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:99px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px}
.stars{display:flex;gap:8px}
.stars button{flex:1;min-height:64px;border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:11.5px;font-weight:800;color:var(--ink)}
.stars button.on{border:2px solid #E0A100;background:#FFF4D1}
.stars svg{width:16px;height:16px}
table.rk{width:100%;border-collapse:collapse;font-size:13px}
table.rk th{font-size:11.5px;color:var(--muted);text-align:left;padding:6px 4px;font-weight:800}
table.rk td{padding:9px 4px;border-top:1px solid var(--line)}
.print{display:none}
@media print{
  body *{visibility:hidden}
  .print,.print *{visibility:visible}
  .print{display:block;position:absolute;left:0;top:0;width:100%;padding:0;color:#000;font-family:Nunito,Arial,sans-serif}
}
</style>

async function api(body, withAuth) {
  if (!API) throw new Error(L('Aplikasi belum tersambung ke Google Sheet. Hubungi tim LMSt ARK.', 'The app is not connected yet. Please contact LMSt ARK.'));
  if (withAuth !== false && S.nama) { body.nama = S.nama; body.kode = S.kode; }
  let res;
  try { res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' }); }
  catch (e) { throw new Error(L('Tidak ada koneksi. Coba lagi.', 'No connection. Please try again.')); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error(L('Server belum siap. Coba lagi sebentar lagi.', 'Server is not ready. Try again shortly.')); }
  if (!j.ok) {
    if (j.error === 'KODE_BELUM_DIBUAT' || /Kode akses salah/.test(j.error || '')) { if (S.nama && S.screen !== 'login') { logout(true); } }
    throw new Error(j.error || 'Error');
  }
  return j;
}

Object.keys(FORMS).forEach(k => { FORMS[k] = FORMS[k].filter(Boolean); });

/* ============ RENDER FORMULIR ============ */
function flatFields(kode) {
  const out = [];
  (FORMS[kode] || []).forEach(f => { if (f.t === 'pair') f.f.forEach(x => out.push(Object.assign({ show: f.show }, x))); else if (f.k) out.push(f); });
  return out;
}
const visible = (f, v) => !f.show || f.show(v);
const optLabel = (f, val) => { const o = (f.opt || []).filter(x => x[0] === val)[0]; return o ? L(o[0], o[1]) : val; };

function labelEl(f, forId, lid) {
  return el(forId ? 'label' : 'span', { class: 'lbl', for: forId || null, id: lid || null }, L(f.l[0], f.l[1]), f.req ? el('span', { class: 'req' }, ' *') : null);
}
let FID = 0;
function fieldEl(f, F, rerender) {
  const v = F.vals;
  if (f.t === 'section') return el('div', { class: 'secthead' }, ic(f.ic || 'pin', 'var(--pri-l)', 'sm'), el('span', { class: 'sec' }, L(f.l[0], f.l[1])));
  if (f.t === 'note') return el('div', { class: 'note ' + (f.tone || 'blue') }, svg(f.ic || 'bulb', 22), el('span', { html: L(f.l[0], f.l[1]) }));
  if (f.t === 'clash') return F.clashBox || (F.clashBox = el('div', { 'aria-live': 'polite' }));
  if (f.t === 'pair') return el('div', { class: 'grid2' }, f.f.map(x => fieldEl(x, F, rerender)));
  const id = 'f' + (++FID);
  const hint = f.hint ? el('span', { class: 'hint' }, L(f.hint[0], f.hint[1])) : null;
  const errEl = F.errors && F.errors[f.k] ? el('span', { class: 'err' }, F.errors[f.k]) : null;
  if (f.t === 'chips' || f.t === 'multi') {
    const lid = id + 'l';
    const cur = v[f.k];
    const cols = f.cols || 2;
    return el('div', { class: 'field' }, labelEl(f, null, lid),
      el('div', { class: 'chips', role: 'group', 'aria-labelledby': lid, style: `grid-template-columns:repeat(${cols},minmax(0,1fr))` },
        f.opt.map(o => {
          const on = f.t === 'multi' ? (Array.isArray(cur) && cur.includes(o[0])) : cur === o[0];
          return el('button', { type: 'button', class: 'chipbtn' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false', onclick: () => {
            if (f.t === 'multi') { const a = Array.isArray(v[f.k]) ? v[f.k].slice() : []; const i = a.indexOf(o[0]); if (i >= 0) a.splice(i, 1); else a.push(o[0]); v[f.k] = a; }
            else v[f.k] = o[0];
            if (F.errors) delete F.errors[f.k];
            rerender();
          } }, L(o[0], o[1]));
        })), hint, errEl);
  }
  const common = { id, class: 'in', name: f.k, value: v[f.k] || '', oninput: e => { v[f.k] = e.target.value; if (F.errors && F.errors[f.k]) { delete F.errors[f.k]; const er = e.target.parentNode.querySelector('.err'); if (er) er.remove(); } if (F.onInput) F.onInput(f.k); },
    placeholder: f.ph ? L(f.ph[0], f.ph[1]) : null, 'aria-required': f.req ? 'true' : null };
  let input;
  if (f.t === 'long') input = el('textarea', Object.assign({ rows: f.rows || 3 }, common));
  else if (f.t === 'number') input = el('input', Object.assign({ type: 'number', inputmode: 'numeric', min: '1', max: f.max || null }, common));
  else if (f.t === 'money') input = el('input', Object.assign({ type: 'text', inputmode: 'numeric', placeholder: '650000' }, common));
  else input = el('input', Object.assign({ type: f.t === 'date' ? 'date' : f.t === 'time' ? 'time' : 'text', autocomplete: 'off' }, common));
  if (f.t === 'date' || f.t === 'time') input.addEventListener('change', e => { v[f.k] = e.target.value; if (F.onInput) F.onInput(f.k); });
  return el('div', { class: 'field' }, labelEl(f, id), input, hint, errEl);
}

function validateForm(kode, v) {
  const err = {};
  flatFields(kode).forEach(f => {
    if (!visible(f, v)) return;
    const val = v[f.k];
    const empty = Array.isArray(val) ? !val.length : !String(val || '').trim();
    if (f.req && empty) err[f.k] = L('Wajib diisi', 'Required');
    else if (f.t === 'number' && !empty && (!(+val > 0) || (f.max && +val > f.max))) err[f.k] = f.max ? L('Isi angka 1 sampai ' + f.max, 'Enter 1 to ' + f.max) : L('Isi angka yang benar', 'Enter a valid number');
    else if (f.t === 'money' && !empty && !/^[\d.,\s]+$/.test(val)) err[f.k] = L('Isi angka saja', 'Numbers only');
  });
  const order = [['checkin', 'checkout'], ['dari', 'sampai'], ['mulai', 'kembali'], ['pg_tgl', 'pl_tgl']];
  order.forEach(([a, b]) => { if (v[a] && v[b] && v[b] < v[a] && visible(flatFields(kode).filter(x => x.k === b)[0] || {}, v)) err[b] = L('Tanggal tidak boleh sebelum ' + v[a], 'Must not be before ' + v[a]); });
  if ((kode === 'ruang' || kode === 'event') && v.mulai && v.selesai && v.selesai <= v.mulai && /^\d\d:\d\d$/.test(v.mulai)) err.selesai = L('Jam selesai harus setelah jam mulai', 'End must be after start');
  return err;
}

function summarize(kode, v) {
  const lines = [], data = {};
  flatFields(kode).forEach(f => {
    if (!visible(f, v)) return;
    const val = v[f.k];
    if (val == null || (Array.isArray(val) ? !val.length : !String(val).trim())) return;
    data[f.k] = val;
    lines.push(f.l[0] + ': ' + (Array.isArray(val) ? val.join(', ') : String(val).trim().replace(/\n+/g, '; ')));
  });
  return { lines, data };
}

  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const cnt = key => { const m = {}; tk.forEach(t => { const k = key(t); m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const per = S.tim.tim.map(m => {
    const mine = tk.filter(t => picsOf(t).includes(m.nama));
    const d = mine.filter(t => t.status === 'Selesai');
    const r = mine.filter(t => t.rating);
    return {
      nama: m.nama, level: m.level, total: mine.length, leader: mine.filter(t => t.leader === m.nama && picsOf(t).length > 1).length,
      selesai: d.length, hari: avg(d.map(t => daysBetween(dparse(t.waktu), dparse(t.selesai))).filter(x => x >= 0)),

      rating: avg(r.map(t => t.rating)), nRating: r.length,

    };
  });
  return { ym, tk, total: tk.length, selesai: done.length, tepat: done.length ? ontime.length / done.length : null, rating: avg(rated.map(t => t.rating)), nRating: rated.length, layanan: cnt(t => t.kode || 'lainnya'), satker: cnt(t => t.untuk), per };
}
const num = (x, d) => (x || x === 0) ? x.toFixed(d == null ? 1 : d).replace('.', LANG === 'id' ? ',' : '.') : '-';
const pct = x => x == null ? '-' : Math.round(x * 100) + '%';

function waRekap(R) {
  const out = ['📊 *Rekap Layanan LMSt ARK · ' + monthLabel(R.ym, 'id') + '*', '🎫 Tiket: ' + R.total + ' · ✅ Selesai: ' + R.selesai + ' · ⏰ Tepat waktu: ' + pct(R.tepat) + ' · ⭐ Rating: ' + (R.nRating ? R.rating.toFixed(1).replace('.', ',') : '-'), ''];

}
function docHTML(R) {

  const lay = R.layanan.map(([k, n]) => `${esc(layName(k))} (${n})`).join(', ') || '-';

  return `<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Dokumen Penilaian LMSt ARK ${esc(monthLabel(R.ym, 'id'))}</title></head>

function downloadDoc(R) {

/* ============ RENDER ============ */
const SCREENS = {
  login: loginScreen, buatkode: buatKodeScreen, beranda: berandaScreen, layanan: layananScreen, form: formScreen, sukses: suksesScreen,
  mine: mineScreen, mdetail: mdetailScreen, ark: infoArkScreen, saran: saranScreen, konsulsat: konsulSatScreen, sarantim: saranTimScreen, struktur: strukturScreen, itkat: itKatScreen, ittopik: itTopikScreen, saya: sayaScreen, privasi: privasiScreen,
  papan: papanScreen, daftar: daftarScreen, tdetail: tdetailScreen, dispo: dispoScreen, kelolainfo: kelolaInfoScreen, resetkode: resetKodeScreen, rekap: rekapScreen
};
const TEAM_ONLY = ['papan', 'daftar', 'tdetail', 'dispo', 'kelolainfo', 'resetkode', 'rekap'];
function render() {
  let s = S.screen;
  if (!S.nama && !['login', 'buatkode'].includes(s)) s = S.screen = 'login';
  if (S.nama && TEAM_ONLY.includes(s) && !(S.me && S.me.tim)) s = S.screen = 'beranda';
  if (S.nama && s === 'resetkode' && !S.me.kabag) s = S.screen = 'saya';
  document.querySelectorAll('.sheetbg').forEach(x => x.remove());
  const out = (SCREENS[s] || berandaScreen)();
  app.replaceChildren(...[].concat(out).filter(Boolean).filter(n => n.tagName !== 'NAV'));
  document.querySelectorAll('body > nav.nav').forEach(n => n.remove());
  const n = [].concat(out).filter(x => x && x.tagName === 'NAV')[0];
  if (n) document.body.append(n);
  document.title = 'Layanan Pegawai LMSt ARK';
}

/* ============ MULAI ============ */
(function start() {
  const sess = LS.get('lmst3_sess');
  if (sess && sess.nama && sess.kode && sess.me) {
    S.nama = sess.nama; S.kode = sess.kode; S.me = sess.me; S.boot = sess.boot;
    S.screen = 'beranda'; history.replaceState({ screen: 'beranda', p: {} }, '');
    render();
    // segarkan profil dan konfigurasi di latar belakang
    api({ action: 'login', nama: S.nama, kode: S.kode }, false).then(r => { if (r.me) { S.me = r.me; S.boot = r.boot; saveSess(); if (['beranda', 'ark', 'saya'].includes(S.screen)) render(); } }).catch(e => { if (/salah|ditemukan|BELUM/i.test(e.message)) logout(true); });
    loadMine().then(() => { if (S.screen === 'beranda') render(); }).catch(() => {});
    if (S.me.tim) loadTim().then(() => { const n = document.querySelector('body > nav.nav'); if (n && ['beranda', 'mine', 'ark', 'saya'].includes(S.screen)) render(); }).catch(() => {});
  } else {
    history.replaceState({ screen: 'login', p: {} }, '');
    render();
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
